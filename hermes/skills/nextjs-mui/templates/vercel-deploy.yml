# Vercel Deploy via GitHub Actions
# Alternativa quando o usuário não consegue conectar o repo diretamente no Vercel
# Como usar:
#   1. Usuário gera um token em https://vercel.com/settings/tokens
#   2. Adiciona como secret VERCEL_TOKEN no GitHub repo
#   3. Cria este arquivo em .github/workflows/deploy.yml
#   4. Faz push na main — o deploy roda automaticamente

name: Deploy to Vercel

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./linikers

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
